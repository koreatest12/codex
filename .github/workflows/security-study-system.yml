name: Security Study System CI
on:
  push:
    paths:
      - 'security-study-system/**'
      - 'data/study/security-exam-2027.json'
      - '.github/workflows/security-study-system.yml'
  pull_request:
    paths:
      - 'security-study-system/**'
      - 'data/study/security-exam-2027.json'
      - '.github/workflows/security-study-system.yml'
permissions:
  contents: read
jobs:
  study-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r security-study-system/requirements-dev.txt
      - name: Run isolated tests
        working-directory: security-study-system
        run: python -m pytest -q tests
