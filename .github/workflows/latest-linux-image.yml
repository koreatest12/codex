name: Latest Linux Image and Container Server

on:
  push:
    branches:
      - main
      - feat/webauthn-security-key
    paths:
      - ".github/workflows/latest-linux-image.yml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "app/**"
      - "docker/**"
      - "requirements.txt"
      - "scripts/**"
      - "SECURITY.md"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/latest-linux-image.yml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "app/**"
      - "docker/**"
      - "requirements.txt"
      - "scripts/**"
      - "SECURITY.md"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build-and-run:
    name: Pull Ubuntu, build server, and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINUX_IMAGE: ubuntu:latest
      SERVER_IMAGE: codex-linux-server:ci
      CONTAINER_NAME: codex-linux-server-ci
      DATA_VOLUME: codex-security-data-ci
      HOST_PORT: "8080"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Show Docker version
        run: docker version

      - name: Pull latest Linux image and run base smoke test
        run: |
          chmod +x scripts/run-latest-linux.sh
          ./scripts/run-latest-linux.sh

      - name: Build and start security-key protected container server
        env:
          CLEANUP_AFTER_TEST: "true"
        run: |
          export SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export WEBAUTHN_BOOTSTRAP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          chmod +x scripts/deploy-container-server.sh
          ./scripts/deploy-container-server.sh

      - name: Show built server image
        run: docker image inspect "${SERVER_IMAGE}" --format 'Image={{.RepoTags}} Size={{.Size}} Created={{.Created}}'
