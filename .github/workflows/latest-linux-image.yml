name: Latest Linux Image and Container Server

on:
  push:
    branches:
      - main
      - feat/container-server-build
    paths:
      - ".github/workflows/latest-linux-image.yml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "tests/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/latest-linux-image.yml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build-and-run:
    name: Pull Ubuntu, build server, and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINUX_IMAGE: ubuntu:latest
      SERVER_IMAGE: codex-linux-server:ci-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: codex-linux-server-ci-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_PORT: "8080"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test non-destructive container behavior (mock Docker)
        run: python3 -m unittest discover -s tests -v

      - name: Show Docker version
        run: docker version

      - name: Pull latest Linux image and run base smoke test
        run: |
          chmod +x scripts/run-latest-linux.sh
          ./scripts/run-latest-linux.sh

      - name: Build and start container server
        run: |
          chmod +x scripts/deploy-container-server.sh
          ./scripts/deploy-container-server.sh

      - name: Show built server image
        run: docker image inspect "${SERVER_IMAGE}" --format 'Image={{.RepoTags}} Size={{.Size}} Created={{.Created}}'
