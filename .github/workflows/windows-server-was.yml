name: Windows Server WAS scripts

on:
  push:
    branches: [main]
    paths:
      - "scripts/windows-server/**"
      - ".github/workflows/windows-server-was.yml"
      - "docs/WINDOWS_SERVER_WAS.md"
  pull_request:
    branches: [main]
    paths:
      - "scripts/windows-server/**"
      - ".github/workflows/windows-server-was.yml"
      - "docs/WINDOWS_SERVER_WAS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-validation:
    name: Check host provisioning and SSH manager scripts
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate PowerShell syntax without creating a VM
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/windows-server/Test-WasHost.ps1',
            'scripts/windows-server/New-WasUbuntuVm.ps1',
            'scripts/windows-server/Invoke-WasUbuntuGuest.ps1'
          )
          foreach ($path in $scripts) {
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $path),
              [ref]$tokens,
              [ref]$errorsFound
            ) | Out-Null
            if ($errorsFound.Count -gt 0) {
              throw ("PowerShell parse errors in $($path): " + ($errorsFound | Out-String))
            }
            Write-Output "PASS: $path"
          }

      - name: Read-only Windows Server host diagnostics
        shell: pwsh
        run: |
          & ./scripts/windows-server/Test-WasHost.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject malformed SSH host names before any connection
        shell: pwsh
        run: |
          $dummyKey = Join-Path $env:RUNNER_TEMP 'placeholder-private-key'
          Set-Content -LiteralPath $dummyKey -Value 'no real key' -NoNewline
          $rejected = $false
          try {
            & ./scripts/windows-server/Invoke-WasUbuntuGuest.ps1 -Action Health -LinuxHost '--unsafe' -LinuxUser ubuntu -IdentityFile $dummyKey
          } catch {
            if ($_.Exception.Message -match 'Invalid LinuxHost') { $rejected = $true }
            else { throw }
          } finally {
            Remove-Item -LiteralPath $dummyKey -Force
          }
          if (-not $rejected) { throw 'Unsafe hostname was not rejected.' }
          Write-Output 'PASS: unsafe SSH destination rejected before use.'
