# Optional Datadog integration: execute explicitly after configuring repository secrets.
# This workflow never downloads or publishes credentials.
name: Run Datadog Synthetic tests

on:
  workflow_dispatch:
    inputs:
      test_search_query:
        description: 'Datadog Synthetic test selection query'
        required: true
        default: 'tag:e2e-tests'
        type: string
      datadog_site:
        description: 'Your Datadog site (e.g. datadoghq.com, datadoghq.eu)'
        required: true
        default: 'datadoghq.com'
        type: string

permissions:
  contents: read

jobs:
  synthetics:
    name: Datadog Synthetic tests (manual, authenticated)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository (Node.js 24 compatible)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Datadog credentials are configured
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [[ -z "$DD_API_KEY" || -z "$DD_APP_KEY" ]]; then
            echo "::error::Set DD_API_KEY and DD_APP_KEY in Settings > Secrets and variables > Actions. See docs/DATADOG-SYNTHETICS.md."
            exit 1
          fi
          echo "Datadog secrets are present (values not displayed)."

      - name: Run Datadog Synthetic tests (Node.js 24 compatible)
        id: synthetics
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
          datadog-site: ${{ inputs.datadog_site }}
          test-search-query: ${{ inputs.test_search_query }}
          fail-on-critical-errors: 'true'
          fail-on-missing-tests: 'true'

      # Never put keys, raw test results, URLs, or test payloads into artifacts.
      - name: Write non-secret result counts for download
        if: ${{ always() && (steps.synthetics.outcome == 'success' || steps.synthetics.outcome == 'failure') }}
        shell: bash
        env:
          SYNTHETICS_OUTCOME: ${{ steps.synthetics.outcome }}
          PASSED_COUNT: ${{ steps.synthetics.outputs.passed-count }}
          FAILED_COUNT: ${{ steps.synthetics.outputs.failed-count }}
          SKIPPED_COUNT: ${{ steps.synthetics.outputs.tests-skipped-count }}
          NOT_FOUND_COUNT: ${{ steps.synthetics.outputs.tests-not-found-count }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const toCount = value => /^\d+$/.test(value || '') ? Number(value) : null;
          const report = {
            schemaVersion: 1,
            result: process.env.SYNTHETICS_OUTCOME === 'success' ? 'success' : 'failure',
            counts: {
              passed: toCount(process.env.PASSED_COUNT),
              failed: toCount(process.env.FAILED_COUNT),
              skipped: toCount(process.env.SKIPPED_COUNT),
              notFound: toCount(process.env.NOT_FOUND_COUNT),
            },
            note: 'Numeric CI metadata only. Credentials and raw Synthetic results excluded.',
          };
          mkdirSync('.ci-reports', { recursive: true });
          writeFileSync('.ci-reports/datadog-summary.json', JSON.stringify(report, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Upload downloadable, non-secret test summary
        if: ${{ always() && (steps.synthetics.outcome == 'success' || steps.synthetics.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6 (Node.js 24)
        with:
          name: datadog-synthetics-summary
          path: .ci-reports/datadog-summary.json
          if-no-files-found: error
          retention-days: 7
