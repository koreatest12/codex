services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: ${LINUX_IMAGE:-ubuntu:latest}
    image: ${SERVER_IMAGE:-codex-linux-server:latest}
    container_name: ${CONTAINER_NAME:-codex-linux-server}
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      WEBAUTHN_BOOTSTRAP_TOKEN: ${WEBAUTHN_BOOTSTRAP_TOKEN:?Set WEBAUTHN_BOOTSTRAP_TOKEN in .env}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID in .env}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN in .env}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Codex Container Server}
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - security-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 8s

volumes:
  security-data:
