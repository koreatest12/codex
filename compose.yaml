services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: ${LINUX_IMAGE:-ubuntu:latest}
    image: ${SERVER_IMAGE:-codex-linux-server:latest}
    container_name: ${CONTAINER_NAME:-codex-linux-server}
    restart: unless-stopped
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      WEBAUTHN_BOOTSTRAP_TOKEN_FILE: /run/secrets/webauthn_bootstrap_token
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID in .env}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN in .env}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Codex Container Server}
    secrets:
      - session_secret
      - webauthn_bootstrap_token
      - data_encryption_key
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - security-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 8s

secrets:
  session_secret:
    file: ./secrets/session_secret
  webauthn_bootstrap_token:
    file: ./secrets/webauthn_bootstrap_token
  data_encryption_key:
    file: ./secrets/data_encryption_key

volumes:
  security-data:
    # Match the volume created by scripts/prepare-docker-storage.sh
    name: ${DATA_VOLUME:-codex-security-data}
