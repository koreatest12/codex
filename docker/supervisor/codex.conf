[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:webauthn-app]
command=/opt/venv/bin/gunicorn --workers 2 --threads 2 --bind 127.0.0.1:8000 --timeout 30 --access-logfile - --error-logfile - server:app
directory=/opt/app
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
priority=20
